<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hue Studio · PC</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{font:15px system-ui,-apple-system,sans-serif;background:#0c101b;color:#f4f6ff;max-width:570px;margin:0 auto;padding:22px}h1{font-size:30px;margin:0 0 4px}.sub{color:#a3acc4;line-height:1.45}.card{background:#1a2132;border:1px solid #343b50;border-radius:20px;padding:18px;margin:16px 0}button,input{font:inherit}button{border:0;padding:13px;border-radius:12px;background:#7674ee;color:white;font-weight:650;cursor:pointer}button:disabled{opacity:.4}.buttons{display:flex;gap:9px;flex-wrap:wrap}.buttons button{flex:1}input[type=range]{width:100%;accent-color:#aba0fc}input[type=color]{height:48px;width:100%;border:0;background:transparent}label{display:block;margin:14px 0 7px}input[type=text]{width:100%;padding:12px;border:1px solid #555f78;border-radius:10px;background:#0c101b;color:white}#log{white-space:pre-wrap;overflow:auto;max-height:160px;font-size:11px;color:#afbdd4}small{color:#aab4c9}.pill{display:inline-block;border-radius:30px;padding:4px 10px;background:#343b50;color:#cbd5ff}.active{background:#4bce95;color:#0b1620}a{color:#bcb5ff}</style><script src="https://cdn.jsdelivr.net/npm/mqtt@5.16.0/dist/mqtt.min.js"></script></head><body><h1>✦ Hue Studio · PC</h1><p class="sub">Control remoto para el foco conectado a Bluefy en tu iPhone.</p><div class="card"><label>Código de enlace del iPhone</label><input id="room" type="text" placeholder="Pega el código de Bluefy" autocomplete="off" spellcheck="false"><p><button id="connect">Conectar panel de PC</button></p><p id="status" class="sub">No conectado</p></div><div class="card"><div class="buttons"><button onclick="send('on')">Encender</button><button onclick="send('off')">Apagar</button></div><label>Brillo: <span id="num">75</span>%</label><input id="bright" type="range" min="1" max="100" value="75"><label>Color</label><input id="color" type="color" value="#a34dff"><button onclick="send('color',document.getElementById('color').value)">Aplicar color</button></div><div class="card"><h3>Efectos</h3><div class="buttons"><button onclick="send('effect','rainbow')">🌈 Arcoíris</button><button onclick="send('effect','pulse')">💗 Respirar</button><button onclick="send('stop')">Detener</button></div></div><p class="sub">Deja Bluefy abierto y el puente remoto activado en el teléfono. Este prototipo utiliza un servidor público de pruebas sin autenticación ni privacidad: no lo uses como servicio permanente.</p><script>
let client,topic,online=false;const $=id=>document.getElementById(id);
$('connect').onclick=()=>{const room=$('room').value.trim();if(!/^[a-f0-9]{32}$/.test(room)){alert('Introduce el código hexadecimal de 32 caracteres mostrado en Bluefy');return}if(typeof mqtt==='undefined'){alert('No cargó MQTT.js');return}if(client)client.end(true);topic='hue-studio/demo/'+room+'/command';online=false;$('status').textContent='Conectando...';client=mqtt.connect('wss://broker.emqx.io:8084/mqtt',{clientId:'hue_pc_'+Math.random().toString(16).slice(2),reconnectPeriod:3000,connectTimeout:10000});client.on('connect',()=>{online=true;$('status').textContent='Conectado al intermediario. Comprueba Bluefy.'});client.on('offline',()=>{online=false;$('status').textContent='Sin conexión'});client.on('error',e=>{$('status').textContent='Error: '+e.message})};
function send(type,value){if(!online){alert('Conecta primero el panel');return}client.publish(topic,JSON.stringify({type,value}),{qos:0,retain:false})}
let bTimer;$('bright').oninput=()=>{$('num').textContent=$('bright').value;clearTimeout(bTimer);bTimer=setTimeout(()=>send('brightness',Number($('bright').value)),180)};
</script></body></html>
