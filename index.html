<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hue BLE Lab</title>
<style>body{font-family:system-ui,-apple-system,sans-serif;background:#10131c;color:#f8fafc;max-width:560px;margin:0 auto;padding:24px}h1{margin-bottom:4px}.sub{color:#99a5b9}button,input{font:inherit}button{padding:13px 16px;border:0;border-radius:12px;background:#758aff;color:white;font-weight:650}button:disabled{opacity:.4}.card{background:#1d2432;border-radius:20px;padding:18px;margin:16px 0}label{display:block;margin:16px 0 7px}input[type=range]{width:100%}input[type=color]{width:100%;height:50px;border:0;background:transparent}#log{white-space:pre-wrap;word-break:break-word;font-size:12px;color:#b0bed2;background:#151a26;padding:14px;border-radius:12px;max-height:220px;overflow:auto}.buttons{display:flex;gap:10px}.buttons button{flex:1}</style>
</head><body><h1>💡 Hue BLE Lab</h1><p class="sub">Prototipo experimental para Bluefy en iPhone. Sin Hue Bridge.</p><div class="card"><button id="connect">Conectar al foco</button><p id="status" class="sub">No conectado</p></div><div class="card"><div class="buttons"><button id="on" disabled>Encender</button><button id="off" disabled>Apagar</button></div><label for="bright">Brillo: <span id="num">75</span>%</label><input id="bright" type="range" min="1" max="100" value="75" disabled><label for="color">Color</label><input id="color" type="color" value="#a34dff" disabled><button id="apply" disabled>Aplicar color</button></div><h3>Diagnóstico</h3><pre id="log">Sin actividad</pre>
<script>
'use strict';
const svc='932c32bd-0000-47a2-835a-a8d455b859dd';
const characteristic= n => `932c32bd-${String(n).padStart(4,'0')}-47a2-835a-a8d455b859dd`;
let device, server, power, brightness, xy;
const $=id=>document.getElementById(id);
function log(message){$('log').textContent=new Date().toLocaleTimeString()+'  '+message+'\n'+($('log').textContent==='Sin actividad'?'':$('log').textContent).slice(0,3200)}
function active(yes){for(const id of ['on','off','bright','color','apply'])$(id).disabled=!yes;$('status').textContent=yes?'Conectado: '+(device?.name||'Hue'):'No conectado'}
async function write(c,bytes){await c.writeValue(new Uint8Array(bytes));log('Comando enviado: '+Array.from(bytes).join(', '))}
$('connect').onclick=async()=>{try{
if(!navigator.bluetooth)throw new Error('Web Bluetooth no está disponible: abre esta página HTTPS en Bluefy.');
$('status').textContent='Buscando dispositivos BLE...';
device=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:[svc]});
device.addEventListener('gattserverdisconnected',()=>{active(false);log('Desconectado')});
log('Seleccionado: '+(device.name||'Sin nombre'));
server=await device.gatt.connect();log('Enlace GATT establecido');
const service=await server.getPrimaryService(svc);log('Servicio Hue encontrado');
power=await service.getCharacteristic(characteristic(2));
brightness=await service.getCharacteristic(characteristic(3));
xy=await service.getCharacteristic(characteristic(5));
try{await power.readValue();log('Lectura de estado correcta')}catch(e){log('Lectura de estado: '+e.message)}
active(true);
}catch(e){active(false);log('ERROR: '+e.message);$('status').textContent='Error: '+e.message}}
$('on').onclick=()=>write(power,[1]).catch(e=>log('ERROR: '+e.message));
$('off').onclick=()=>write(power,[0]).catch(e=>log('ERROR: '+e.message));
let brightnessTimer;
$('bright').oninput=()=>{$('num').textContent=$('bright').value;clearTimeout(brightnessTimer);brightnessTimer=setTimeout(()=>{let v=Math.round(1+(Number($('bright').value)-1)*253/99);write(brightness,[v]).catch(e=>log('ERROR: '+e.message))},180)};
function rgbToXy(hex){const vals=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)/255).map(v=>v>0.04045?Math.pow((v+0.055)/1.055,2.4):v/12.92);const [r,g,b]=vals;const X=.664511*r+.154324*g+.162028*b;const Y=.283881*r+.668433*g+.047685*b;const Z=.000088*r+.07231*g+.986039*b;const sum=X+Y+Z;return sum>0?[X/sum,Y/sum]:[.3,.3]}
$('apply').onclick=async()=>{try{const [x,y]=rgbToXy($('color').value);const data=new DataView(new ArrayBuffer(4));data.setUint16(0,Math.round(x*65535),true);data.setUint16(2,Math.round(y*65535),true);await write(xy,Array.from(new Uint8Array(data.buffer)));log('Color XY: '+x.toFixed(3)+', '+y.toFixed(3))}catch(e){log('ERROR: '+e.message)}};
</script></body></html>
